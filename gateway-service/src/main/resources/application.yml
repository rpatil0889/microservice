server:
  port: 8131

spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      client:
        health-indicator:
          enabled: true
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8121/eureka
    initial-instance-info-replication-interval-seconds: 30
    registry-fetch-interval-seconds: 30

  instance:
      preferIpAddress: true
      instanceId: ${spring.application.name}:${spring.application.instance_id:${random.value}}

